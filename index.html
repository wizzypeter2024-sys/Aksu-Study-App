function home(){document.getElementById('app').innerHTML=`<div class="header"><div class="hero-badge">🎓 Built for AKSU students</div><h1 class="hero-title">AKSU Study Companion</h1><p class="hero-sub">Your free Public Administration study companion for CBT practice, course revision, GPA calculation and study progress.</p><p style="margin:10px 0 0;font-weight:700">100 Level • 2025/2026</p></div><div class="container"><div class="feature-strip"><div class="feature-pill">📝 35-question CBT practice</div><div class="feature-pill">📚 18 courses</div><div class="feature-pill">🧮 GPA calculator</div></div><h2 class="section-title">Study smarter</h2><p class="section-copy">Choose a section below to revise your courses, practise questions and keep track of your studies.</p><div class="grid"><div class="card" onclick="semester('first')"><div class="icon">📘</div><h3>First Semester</h3><p>9 Courses • 20 Units</p></div><div class="card" onclick="semester('second')"><div class="icon">📗</div><h3>Second Semester</h3><p>9 Courses • 18 Units</p></div><div class="card" onclick="cbtHome()"><div class="icon">📝</div><h3>CBT Practice</h3><p>35 questions per course</p></div><div class="card" onclick="gpaHome()"><div class="icon">🧮</div><h3>GPA Calculator</h3><p>Calculate your GPA</p></div><div class="card" onclick="materialsHome()"><div class="icon">📚</div><h3>Study Materials</h3><p>Revision notes</p></div><div class="card" onclick="progress()"><div class="icon">📊</div><h3>My Progress</h3><p>Track CBT best scores</p></div></div><h2 class="section-title">Get the Android app</h2><p class="section-copy">Install AKSU Study Companion on your Android phone for quick access to your study tools.</p><a class="download-app" href="aksu_study_companion.apk" download>📱 Download Android App</a><p class="muted download-note">Free Android APK • Tap to download</p><div class="trust-note"><b>Student-focused:</b> AKSU Study Companion is an independent educational project designed to support study and revision. Always confirm official academic information with Akwa Ibom State University.</div></div><div class="profile"><img src="profile.png" alt="Wisdom Anthony Peter, developer of AKSU Study Companion"><h2>Wisdom Anthony Peter</h2><p style="margin-top:4px;color:#087f3d;font-weight:700">Developer • AKSU Study Companion</p><div class="profile-meta"><div><span>Department</span><b>Public Administration</b></div><div><span>Level</span><b>100 Level</b></div><div><span>School</span><b>Akwa Ibom State University</b></div><div><span>Project</span><b>AKSU Study Companion</b></div></div><p class="muted">Questions, feedback or suggestions about the study app?</p><a class="contact-link" href="mailto:wizzypeter2024@gmail.com">✉️ Contact Developer</a></div><div class="footer">AKSU Study Companion • Free student study tool</div>`}
function page(title,body){document.getElementById('app').innerHTML=`<div class="page"><h1>${title}</h1>${body}</div>`}
function semester(s){let list=courses.filter(c=>c.semester===s).map(c=>`<div class="course"><b>${c.code}</b><br>${c.name} <span class="muted">(${c.unit} units)</span></div>`).join('');page(s==='first'?'📘 First Semester':'📗 Second Semester',list+`<br><button onclick="home()">← Back to Home</button>`)}
function cbtHome(){page('📝 CBT Practice',`<p>Choose a semester. Choose a semester and course. Each course contains 35 different practice questions covering key revision areas.</p><button onclick="cbtSemester('first')">📘 First Semester</button><br><br><button onclick="cbtSemester('second')">📗 Second Semester</button><br><br><button onclick="home()">← Home</button>`)}
function cbtSemester(s){let b=courses.filter(c=>c.semester===s).map(c=>`<button class="wide" onclick='startCBT(${JSON.stringify(c.code)})'>${c.code} — ${c.name}</button>`).join('');page('📝 '+(s==='first'?'First':'Second')+' Semester CBT',b+`<br><button onclick="cbtHome()">← Back</button>`)}
function startCBT(code){currentCode=code;currentQuestion=0;currentScore=0;showQuestion()}
function showQuestion(){answered=false;let q=questionBanks[currentCode][currentQuestion],pct=Math.round((currentQuestion+1)/questionBanks[currentCode].length*100);page('📝 '+currentCode+` CBT`,`<div class="bar"><span style="width:${pct}%"></span></div><p><b>Question ${currentQuestion+1} of 35</b></p><div class="box"><h3>${q.question}</h3>${q.options.map((o,i)=>`<button class="answer" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<h3 id="result"></h3><button id="next" style="display:none" onclick="nextQ()">${currentQuestion===34?'See Result →':'Next Question →'}</button></div><br><button onclick="cbtHome()">← Quit CBT</button>`)}
function answer(i){if(answered)return;answered=true;let q=questionBanks[currentCode][currentQuestion],r=document.getElementById('result');if(i===q.answer){currentScore++;r.textContent='✅ Correct!';r.style.color='green'}else{r.textContent='❌ Wrong! Correct answer: '+q.options[q.answer];r.style.color='red'}document.getElementById('next').style.display='inline-block'}
function nextQ(){currentQuestion++;if(currentQuestion<35)showQuestion();else showResult()}
function showResult(){let p=Math.round(currentScore/35*100),key='best_'+currentCode,best=Number(localStorage.getItem(key)||0);if(currentScore>best){best=currentScore;localStorage.setItem(key,best)}let msg=p>=80?'Excellent work! 🌟':p>=60?'Good job — keep revising. 👍':p>=40?'Nice attempt — more practice will help. 📚':'Keep studying and try again. 💪';page('🎉 CBT Completed!',`<div class="box" style="text-align:center"><div style="font-size:48px">🏆</div><h2>${currentCode}</h2><h1 style="font-size:42px;margin:8px 0">${currentScore} / 35</h1><h2>${p}%</h2><p>${msg}</p><div class="bar"><span style="width:${p}%"></span></div><p class="muted">Best score on this device: <b>${best} / 35</b></p></div><button onclick="startCBT(currentCode)">🔄 Try Again</button><br><br><button onclick="cbtHome()">← CBT Courses</button><br><br><button onclick="home()">🏠 Home</button>`)}
function gpaHome(){page('🧮 GPA Calculator',`<p>Uses a 5-point scale: A=5, B=4, C=3, D=2, E=1, F=0.</p><button onclick="gpaSemester('first')">📘 First Semester</button><br><br><button onclick="gpaSemester('second')">📗 Second Semester</button><br><br><button onclick="home()">← Home</button>`)}
function gpaSemester(s){let cs=courses.filter(c=>c.semester===s),b=cs.map((c,i)=>`<div class="course"><b>${c.code}</b> — ${c.name}<br><span class="muted">${c.unit} units</span><br><br><select id="g${i}"><option value="">Select Grade</option><option value="5">A</option><option value="4">B</option><option value="3">C</option><option value="2">D</option><option value="1">E</option><option value="0">F</option></select></div>`).join('');page((s==='first'?'📘 First':'📗 Second')+' Semester GPA',b+`<button onclick="calcGPA('${s}')">Calculate GPA</button><div id="gpaResult"></div><br><button onclick="gpaHome()">← Back</button>`)}
function calcGPA(s){let cs=courses.filter(c=>c.semester===s),pts=0,units=0;for(let i=0;i<cs.length;i++){let v=document.getElementById('g'+i).value;if(v===''){document.getElementById('gpaResult').innerHTML='<div class="course">⚠️ Select a grade for every course.</div>';return}pts+=Number(v)*cs[i].unit;units+=cs[i].unit}let g=pts/units;document.getElementById('gpaResult').innerHTML=`<div class="course" style="text-align:center"><h2>Your GPA</h2><h1>${g.toFixed(2)}</h1><p>Total Units: ${units}</p></div>`}
function materialsHome(){page('📚 Study Materials',`<p>Generated revision notes to support your study. Use them together with lecturer and official course materials.</p><button onclick="materialsSemester('first')">📘 First Semester</button><br><br><button onclick="materialsSemester('second')">📗 Second Semester</button><br><br><button onclick="home()">← Home</button>`)}
function materialsSemester(s){let b=courses.filter(c=>c.semester===s).map(c=>`<button class="wide" onclick='openMaterial(${JSON.stringify(c.code)})'>${c.code} — ${c.name}</button>`).join('');page('📚 '+(s==='first'?'First':'Second')+' Semester Materials',b+`<br><button onclick="materialsHome()">← Back</button>`)}
function openMaterial(code){let m=materials[code],points=m.points.map((x,i)=>`<div class="course"><b>${i+1}.</b> ${x}</div>`).join('');page('📚 '+code+' — '+m.title,`<div class="box"><p>${m.intro}</p><p class="muted"><b>Note:</b> These are generated revision notes, not official AKSU lecture notes.</p></div><h2>Key Revision Areas</h2>${points}<div class="box"><h3>Revision Summary</h3><p>${m.summary}</p></div><button onclick="startCBT(code)">📝 Practice 35 Questions</button><br><br><button onclick="materialsHome()">← Materials</button><br><br><button onclick="home()">🏠 Home</button>`)}
function progress(){let rows=courses.map(c=>{let b=Number(localStorage.getItem('best_'+c.code)||0);return `<div class="course"><b>${c.code}</b> — Best CBT score: ${b} / 35</div>`}).join('');page('📊 My Progress',`<p>Your best CBT scores are saved on this device.</p>${rows}<br><button onclick="home()">← Home</button>`)}
home();
